name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore TaskMetricAI.sln
      - run: dotnet build TaskMetricAI.sln -c Release --no-restore
      - run: dotnet test TaskMetricAI.sln -c Release --no-build --no-restore
